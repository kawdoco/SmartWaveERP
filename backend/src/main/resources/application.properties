# ============================================================
# SmartWave ERP Backend — Main Application Configuration
# ============================================================
# Sensitive / environment-specific values come from the .env file
# (loaded by your shell or docker-compose) and are referenced here
# via ${ENV_VAR_NAME:default} placeholders.
# ============================================================

# ----- Application -----
spring.application.name=smartwave-erp-backend

# ----- Server -----
# CHANGE: port is now read from SERVER_PORT env var (default 8080)
server.port=${SERVER_PORT:8080}

# ----- Active Profile -----
# CHANGE: profile is now read from SPRING_PROFILE env var (default dev)
spring.profiles.active=${SPRING_PROFILE:dev}

# ----- CORS -----
# CHANGE: allowed origins are now read from ALLOWED_ORIGINS env var.
# WebConfig.java reads this property instead of hardcoding origin strings.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ----- JWT -----
# CHANGE: JWT secret and expiry are read from env vars instead of being
# hardcoded directly in application.properties.
app.jwt.secret=${JWT_SECRET:smartwaveERPSecretKey2026ForJWTTokenGenerationAndValidation123456789}
# Token expiry in milliseconds (86400000 = 24 h)
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----- Logging -----
logging.level.org.springframework.web=DEBUG

# ----- Spring Boot Actuator -----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
