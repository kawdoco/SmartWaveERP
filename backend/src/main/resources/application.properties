# Application Configuration
spring.application.name=smartwave-erp-backend

# Server Configuration
server.port=8080
# server.servlet.context-path=/api

# Database Configuration (PostgreSQL via Supabase)
# Note: Update these values when Supabase project is ready
# spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartwave_erp}
# spring.datasource.username=${DATABASE_USERNAME:postgres}
# spring.datasource.password=${DATABASE_PASSWORD:password}
# spring.datasource.driver-class-name=org.postgresql.Driver

# Database Configuration (using H2 for now)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Keep everything else the same
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.jwt.secret=smartwaveERPSecretKey2026ForJWTTokenGenerationAndValidation123456789
app.jwt.expiration=86400000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=smartwaveERPSecretKey2026ForJWTTokenGenerationAndValidation123456789
app.jwt.expiration=86400000

# Logging
logging.level.org.springframework.web=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Active Profile
spring.profiles.active=${SPRING_PROFILE:dev}
