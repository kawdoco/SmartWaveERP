# Application Configuration
spring.application.name=smartwave-erp-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration (PostgreSQL via Supabase)
# Note: Update these values when Supabase project is ready
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartwave_erp}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartwave.erp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Active Profile
spring.profiles.active=${SPRING_PROFILE:dev}
