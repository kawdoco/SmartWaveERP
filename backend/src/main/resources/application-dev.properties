# ----- Detailed error responses (dev-only) -----
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# ----- Database (Supabase PostgreSQL via PgBouncer Pooler) -----
# CHANGE: URL, username, and password now come from the .env file.
# '?prepareThreshold=0' is required for PgBouncer Transaction mode.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DATABASE_USERNAME:postgres.wcbtapepxvvyikqekejb}
spring.datasource.password=${DATABASE_PASSWORD:23@Ttnt4532}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA dialect for PostgreSQL -----
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----- Dev security logging -----
logging.level.org.springframework.security=DEBUG
